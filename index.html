<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Higher D&amp;M Revision</title>
<meta name="description" content="Daily revision missions for Higher Design and Manufacture">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efede8; --ink:#1c1d1f; --ink-2:#4a4d52; --muted:#6f737a; --line:#dcd9d2;
  --accent:#2f5d8a; --accent-2:#1d3c5c; --accent-soft:#dfe8f1; --on-accent:#ffffff;
  --good:#1f7a4a; --good-soft:#dcf1e4; --bad:#b3372c; --bad-soft:#f8e0dc; --warn:#8a5a00; --warn-soft:#fbefd4;
  --mark:#fff1b8; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131416; --surface:#1c1e21; --surface-2:#25282c; --ink:#ecedef; --ink-2:#c3c6cb; --muted:#9398a0; --line:#34383d;
    --accent:#7fb0e0; --accent-2:#a9cbee; --accent-soft:#223549; --on-accent:#0d1620;
    --good:#6fd39c; --good-soft:#173726; --bad:#f2968b; --bad-soft:#3e1d1a; --warn:#f0c46b; --warn-soft:#3a2d12;
    --mark:#4a4020; --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1c1e21; --surface-2:#25282c; --ink:#ecedef; --ink-2:#c3c6cb; --muted:#9398a0; --line:#34383d;
  --accent:#7fb0e0; --accent-2:#a9cbee; --accent-soft:#223549; --on-accent:#0d1620;
  --good:#6fd39c; --good-soft:#173726; --bad:#f2968b; --bad-soft:#3e1d1a; --warn:#f0c46b; --warn-soft:#3a2d12;
  --mark:#4a4020; --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 0}
.brand{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;margin-left:22px;margin-top:-4px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}
main{padding:16px 0 24px}
h1{font-size:22px;line-height:1.25;margin:4px 0 6px}
h2{font-size:18px;margin:22px 0 8px}
h3{font-size:16px;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.card ul{margin:6px 0;padding-left:20px} .card li{margin:4px 0}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tag.design{background:var(--accent-soft);color:var(--accent-2)}
.tag.mm{background:var(--warn-soft);color:var(--warn)}
.tag.impact{background:var(--good-soft);color:var(--good)}
.tag.paper{background:var(--bad-soft);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.stagebar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 4px}
.stagebar button{border:0;background:none;padding:0;cursor:pointer;text-align:left;min-width:0}
.stagebar .bar{height:6px;border-radius:4px;background:var(--line)}
.stagebar .on .bar{background:var(--accent)} .stagebar .cur .bar{background:var(--accent-2)}
.stagebar .lbl{font-size:11px;color:var(--muted);margin-top:4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagebar .cur .lbl{color:var(--ink);font-weight:600}
.reveal{margin-top:8px}
.reveal .ans{display:none;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--good-soft)}
.reveal.open .ans{display:block}
.q{font-weight:600}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;min-height:44px;line-height:1.4}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}
.why b.ok{color:var(--good)} .why b.no{color:var(--bad)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;resize:vertical;margin-top:10px}
.scheme{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.scheme h4{margin:10px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.box{border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px}
.box.full{background:var(--good-soft)} .box.weak{background:var(--bad-soft)} .box.rule{background:var(--warn-soft)}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.marks button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.marks button.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mk{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.model .seg.earn{background:var(--mark);border-radius:3px;padding:0 2px}
.model .note{display:inline-block;font-size:12px;font-weight:600;color:var(--good);background:var(--good-soft);border-radius:6px;padding:0 6px;margin:0 2px}
.fig{margin:10px 0;color:var(--ink)} .fig svg{width:100%;height:auto;display:block} .fig figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.daylist{display:grid;gap:8px}
.dayrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.dayrow .n{font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.dayrow.done .n{color:var(--good)} .dayrow.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dayrow .t{font-weight:600;line-height:1.3;min-width:0}
.dayrow .s{font-size:12px;color:var(--muted)}
.dayrow .r{font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.alert{border-radius:12px;padding:10px 14px;margin:12px 0;background:var(--warn-soft);color:var(--ink)}
.alert.good{background:var(--good-soft)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .card{margin:0;text-align:center;padding:12px 6px}
.stat .v{font-size:24px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:8px;margin-top:6px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:14px}
.bars .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .track{grid-column:1/-1;height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:-4px}
.bars .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
details.coach{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 16px}
details.coach summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.coach summary::-webkit-details-marker{display:none}
details.coach summary .m{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
details.coach[open] summary{border-bottom:1px solid var(--line)}
details.coach .body{padding:8px 0 14px}
.progress{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--good)}
.grade{font-size:36px;font-weight:800;color:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.sec{margin:22px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;max-width:min(420px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.4)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=date],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);min-height:44px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
table.rules{width:100%;border-collapse:collapse;font-size:14px}
table.rules td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
table.rules td:first-child{font-weight:600;width:34%}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="topbar">
    <div class="brand">Higher Design &amp; Manufacture</div>
    <button class="iconbtn" id="themeBtn" aria-label="Change theme" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    <button class="iconbtn" id="setBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
</div></header>
<main class="wrap" id="main"></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<dialog id="settings"></dialog>
<div class="toast" id="toast"></div>
<script>
// ===== Content helpers =====
// MCQs: the correct option is always written FIRST (a:0); the app shuffles the display order.
const MC = (q, o, why) => ({ t: 'mcq', q, o, why });
const PK = (q, o, why) => ({ t: 'mcq', pick: true, q, o, why }); // "which answer earns the mark?"
const EX = (x) => Object.assign({ t: 'ext' }, x);

const DAYS = [];

// ---------------------------------------------------------------- DAY 1
DAYS.push({
  day: 1, area: 'design', title: 'Command words and the design brief',
  warm: [
    { q: 'The marking instructions (MI) say a <b>describe</b> answer must give what?', a: 'A statement or structure of characteristics and/or features. It must be more than an outline or a list, and it must be in the context of the question.' },
    { q: 'What does an <b>explain</b> answer have to do?', a: 'Relate cause and effect, or make the relationship between things clear, in the context of the question. Use "because…", "which means…", "so that…".' },
    { q: 'A question is worth 4 marks. What does the 2025 course report say you need?', a: 'Four different correct statements, or an extended response that develops the points. One point per mark, no repetition.' }
  ],
  core: {
    cards: [
      { h: 'Command words, as the MI define them', p: [
        '<b>Describe</b>: give features or characteristics, more than a list, in the context of the question.',
        '<b>Explain</b>: relate cause and effect. Property or feature → what it does for <i>this</i> product.',
        '<b>Discuss</b>: communicate ideas and information; you may debate two sides.',
        '<b>State / name / identify</b>: a word or short phrase. Usually 1 mark, and often only part of a mark pair (e.g. name the process = 1, explain why = 1).',
        '<b>Outline</b>: a brief statement of what something is or covers (e.g. what a patent protects).',
        '<b>Justify</b>: give reasons why a choice is suitable. In the MI this is marked like explain: each reason must be linked to the product.',
        '<b>Compare / evaluate</b>: refer to both options and make a judgement, giving strengths and weaknesses. A one-sided answer caps your marks.'
      ]},
      { h: 'How D&M answers lose marks (from the 2026 MI and 2025 report)', p: [
        '"No marks awarded for simply stating properties." <i>ABS is impact resistant</i> = 0. Add the consequence for this product.',
        '"No marks should be awarded for giving a definition of technology push or market pull." Describe the <i>influence</i> on a product instead.',
        '"No marks should be awarded for simply naming a research technique." Describe the stages.',
        '"No marks awarded for repetition of explanations." Six marks need six <i>different</i> points.',
        'The consequence has to be real. The MI gave 0 for "ABS is impact resistant as it can withstand being picked up and put down": being picked up does not need impact resistance.',
        '"2 marks may be awarded for an extended description": one point developed with a second, linked consequence can earn 2.'
      ]},
      { h: 'The design brief', p: [
        '<b>Purpose</b>: outlines the main objectives, and identifies important constraints or limitations.',
        '<b>Open brief</b>: general, few constraints. Designer: freedom and creativity, a wider range of possible solutions; but less direction, more research needed to define the problem. Client: may get an innovative product; but the proposal may not match what they expected.',
        '<b>Closed brief</b>: specific constraints (size, cost, materials, user). Designer: clear direction, quicker to start; but creativity is limited. Client: more likely to get what they wanted, with less risk of wasted design time; but may miss more innovative solutions.'
      ]}
    ],
    model: {
      q: 'Describe one advantage and one disadvantage to a designer of working to an open design brief. (2 marks)', max: 2,
      parts: [
        ['An open brief has few constraints, so the designer has the freedom to explore a wide range of creative solutions', '1 mark: advantage described, not just named'],
        [' that the client may not have thought of.', null],
        [' However, because the client’s requirements are not clearly defined, the designer may spend longer researching and could produce a proposal that does not match what the client expected.', '1 mark: disadvantage, with its consequence'],
      ]
    }
  },
  exam: [
    PK('Which answer earns the mark? "Explain why ABS is suitable for the casing of a hairdryer."', [
      'ABS is heat resistant, so the casing will not soften or change shape while the hairdryer is running for a long time.',
      'ABS is impact resistant.',
      'ABS is impact resistant as it can withstand being picked up and put down.',
      'ABS is a thermoplastic so it is suitable.'],
      'Only the first links a property to a real consequence for this product. The 2026 MI gave 0 marks for “withstand being picked up and put down”: being picked up does not need impact resistance.'),
    PK('Which answer earns the mark? "Describe how market pull has influenced the design of mobile phones."', [
      'Users wanted to pay without carrying a wallet, so phones were designed with contactless payment built in.',
      'Market pull is when consumers demand a new product.',
      'Market pull is the opposite of technology push.',
      'Mobile phones have been influenced a lot by market pull.'],
      'The 2025 course report says many candidates wrote what market pull <i>is</i> instead of how it influenced a product. Definitions get 0.'),
    MC('A client asks for "a bench seat for a bus shelter, no longer than 1200 mm, in galvanised steel, vandal-resistant". This is best described as…', [
      'a closed design brief', 'an open design brief', 'a technical specification', 'a performance specification'],
      'It sets specific constraints (size, material, performance), so it is a closed brief. A specification is written <i>after</i> research, and a brief is where the process starts.'),
    MC('Which is the MI’s definition of <b>discuss</b>?', [
      'Communicate ideas and information on a subject; it may be possible to debate two sides.',
      'Relate cause and effect in the context of the question.',
      'Give a statement or structure of characteristics and/or features.',
      'Give a single word or short phrase.'],
      'Describe = features. Explain = cause and effect. Discuss = ideas and information, possibly both sides.'),
    EX({ q: 'Explain two benefits to a <b>client</b> of setting a closed design brief. (2 marks)', max: 2,
      scheme: ['The proposal is more likely to meet the client’s exact needs, because the constraints are fixed from the start.',
        'Less risk of wasted design time and cost, as the designer has clear direction.',
        'Budget, size or material limits are built in, so the product is more likely to be affordable to manufacture or fit the space.',
        'Easier to evaluate the proposal against clear requirements.', 'Any other valid explanation.'],
      rules: ['1 mark per valid explanation.', 'The benefit must be to the client. Benefits to the designer earn 0.', 'A bare statement such as “it is specific” earns 0.'],
      model: 'Because the client sets specific constraints, the final proposal is more likely to meet their exact needs, so they get the product they asked for (1). It also reduces the risk of paying for design time spent on solutions they do not want, which keeps development costs down (1).',
      weak: 'A closed brief is specific. It gives the designer clear direction.',
      weakWhy: '0 marks. The first sentence restates what a closed brief is, and the second is a benefit to the designer, not the client.' })
  ],
  boss: EX({ q: 'Discuss the benefits and drawbacks to a designer of working to an open design brief rather than a closed brief. (4 marks)', max: 4,
    scheme: ['Benefit: freedom to be creative and innovative.', 'Benefit: a wider range of possible solutions can be explored.',
      'Benefit: opportunity to identify a new market or product type.', 'Drawback: less direction, so harder to know where to start or focus.',
      'Drawback: more research is needed to define constraints, which takes time and increases cost.', 'Drawback: greater risk the proposal will not match the client’s expectations.', 'Any other valid point.'],
    rules: ['1 mark per valid point.', 'Maximum 3 marks if only benefits or only drawbacks are given. Discuss means both sides.'],
    model: 'An open brief lets the designer be creative, because there are few constraints limiting the form or function of the product (1), so a wider range of solutions can be explored, which may lead to a more innovative product (1). However, with less direction the designer must carry out more research to define the problem, which takes longer and increases development cost (1). There is also a greater risk that the final proposal will not match what the client expected, as their needs were not clearly stated (1).',
    weak: 'An open brief is good because you can be creative. A closed brief is bad because it is restrictive.',
    weakWhy: '1 mark at most. “Can be creative” is a benefit, but it is not developed, and the second sentence is about closed briefs, not drawbacks of open ones.' })
});

// ---------------------------------------------------------------- DAY 2
DAYS.push({
  day: 2, area: 'design', title: 'Research and evaluation techniques',
  warm: [
    { q: 'Name the two things the purpose of a design brief covers.', a: 'It outlines the main objectives, and it identifies important constraints or limitations.' },
    { q: 'Give one drawback to the <b>client</b> of an open brief.', a: 'The proposal may not match what they expected, because their requirements were not clearly defined.' },
    { q: 'Why would “ABS is scratch resistant” get 0 marks on its own?', a: 'It only states a property. You must explain the consequence for the product, e.g. “…so the casing keeps its appearance after repeated use.”' }
  ],
  core: {
    cards: [
      { h: 'Why research and evaluate?', p: [
        'Research throughout the design process: to inform the specification, and to clarify and inform decisions during exploration and refinement.',
        'Researching existing products: to identify the issues that influence their design, manufacture and marketing, and to identify and justify the materials, processes and assembly used.',
        'Evaluation throughout the process: testing ideas and giving feedback on design decisions, and identifying areas for further development.',
        'Evaluating existing products: how and why they are successful, design opportunities, strengths and weaknesses.'
      ]},
      { h: 'Primary vs secondary', p: [
        '<b>Primary</b> (first-hand, gathered by you): evaluations of existing products, prototypes or models; product comparisons; questionnaires and surveys; tests and test rigs; user trials and user trips.',
        '<b>Secondary</b> (someone else gathered it): books, journals, product reviews, websites.'
      ]},
      { h: 'Key stages: learn these as sequences', p: [
        '<b>Comparisons</b>: identify the information required → decide which aspects of the products to compare → select appropriate products → compare results.',

</script>
<script>
(function(){
'use strict';
const KEY = 'hdm-revision-v1';
const DEFAULT_TEST = '2026-10-15';
const NDAYS = DAYS.length; // 21
const STAGES = ['Warm-up', 'Core drill', 'Exam questions', 'Boss question'];
const REVIEW_STAGES = ['Warm-up', 'Repeat Offenders', 'Rules & weak spots', 'Night before'];
const PAPER_STAGES = ['Warm-up', 'Paper'];
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------------- storage (localStorage only; safe if unavailable)
function blank(){ return { testDate: DEFAULT_TEST, theme: 'auto', done: {}, ans: {}, texts: {}, stage: {}, papers: {}, coach: {}, tab: 'today', view: null }; }
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------------- dates
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parse(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function today(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function diffDays(a, b){ return Math.round((a - b) / 86400000); }
function nice(d){ return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function planned(n){ return addDays(parse(S.testDate), n - (NDAYS + 1)); } // Day 21 = day before test; Day 20 = two days before

// ---------------- question index
const QIDX = {};
DAYS.forEach(D => {
  (D.exam || []).forEach((q, i) => { q.id = 'd' + D.day + '-e' + i; q.day = D.day; q.tp = D.day; QIDX[q.id] = q; });
  if (D.boss) { D.boss.id = 'd' + D.day + '-b'; D.boss.day = D.day; D.boss.tp = D.day; D.boss.isBoss = true; QIDX[D.boss.id] = D.boss; }
  if (D.paper) D.paper.questions.forEach(q => { q.id = 'p-' + D.paper.id + '-' + q.n; q.day = D.day; q.paper = D.paper.id; QIDX[q.id] = q; });
});
const dayOf = n => DAYS.find(d => d.day === n);
function stagesFor(D){ return D.review ? REVIEW_STAGES : D.paper ? PAPER_STAGES : STAGES; }

// ---------------- scoring helpers
function qMax(q){ return q.t === 'mcq' ? 1 : q.max; }
function dayQs(D){ return D.paper ? D.paper.questions : [...(D.exam || []), ...(D.boss ? [D.boss] : [])]; }
function dayScore(D){ let g = 0, m = 0, n = 0; dayQs(D).forEach(q => { const a = S.ans[q.id]; if (a) { g += a.got; m += a.max; n++; } }); return { got: g, max: m, answered: n, total: dayQs(D).length }; }
function offenders(){ return Object.keys(S.ans).filter(id => QIDX[id] && S.ans[id].got < S.ans[id].max).map(id => QIDX[id]); }
function xp(){
  let x = 0;
  Object.keys(S.done).forEach(k => { const d = S.done[k]; x += 10; if (d.bossFull) x += 5; if (d.paperMarks) x += d.paperMarks; });
  return x;
}
function streak(){
  const set = new Set(Object.values(S.done).map(d => d.date));
  let d = today(); if (!set.has(ymd(d))) d = addDays(d, -1);
  let n = 0; while (set.has(ymd(d))) { n++; d = addDays(d, -1); }
  return n;
}
function nextDay(){ for (const D of DAYS) if (!S.done[D.day]) return D.day; return null; }
function grade(p){ return p >= 70 ? 'A' : p >= 60 ? 'B' : p >= 50 ? 'C' : p >= 40 ? 'D' : 'No award'; }
function topicStats(){
  const t = {};
  Object.keys(S.ans).forEach(id => { const q = QIDX[id]; if (!q) return; const k = q.tp; t[k] = t[k] || { got: 0, max: 0 }; t[k].got += S.ans[id].got; t[k].max += S.ans[id].max; });
  return Object.keys(t).map(k => ({ day: +k, title: dayOf(+k).title, got: t[k].got, max: t[k].max, pct: t[k].max ? Math.round(100 * t[k].got / t[k].max) : 0 }))
    .filter(r => dayOf(r.day).area !== 'paper').sort((a, b) => a.pct - b.pct || b.max - a.max);
}

// ---------------- seeded shuffle for MCQ options (correct option is authored first)
function seeded(str){ let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }
function order(q){ const r = seeded(q.id), a = q.o.map((_, i) => i); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------- theme
function applyTheme(){ const r = document.documentElement; if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme); }
applyTheme();
$('#themeBtn').onclick = () => { S.theme = S.theme === 'auto' ? 'light' : S.theme === 'light' ? 'dark' : 'auto'; applyTheme(); save(); toast('Theme: ' + (S.theme === 'auto' ? 'follow device' : S.theme)); };

let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

// ---------------- header chips
function chips(){
  const left = diffDays(parse(S.testDate), today());
  const cd = left > 1 ? '<b>' + left + '</b> days to test' : left === 1 ? '<b>Test tomorrow</b>' : left === 0 ? '<b>Test today</b>' : 'Test done';
  $('#chips').innerHTML = '<span class="chip">' + cd + '</span><span class="chip"><b>' + xp() + '</b> XP</span><span class="chip">Streak <b>' + streak() + '</b></span><span class="chip"><b>' + Object.keys(S.done).length + '</b>/' + NDAYS + ' done</span>';
}

// ---------------- tabs
const ICON = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  coach: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M6 16l9-9 3 3-9 9H6z"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>',
  prog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};
const TABS = [['today', 'Today'], ['plan', 'Plan'], ['coach', 'Assignment'], ['off', 'Offenders'], ['prog', 'Progress']];
function tabs(){
  const n = offenders().length;
  $('#tabs').innerHTML = TABS.map(([k, l]) => '<button data-tab="' + k + '"' + (S.tab === k ? ' aria-current="page"' : '') + '>' + ICON[k] + (k === 'off' && n ? '<span class="badge">' + n + '</span>' : '') + '<span>' + l + '</span></button>').join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.view = null; save(); render(); window.scrollTo(0, 0); });
}

// ---------------- render root
function render(){
  chips(); tabs();
  const m = $('#main');
  if (S.view) return renderDay(m, S.view);
  ({ today: renderToday, plan: renderPlan, coach: renderCoach, off: renderOffenders, prog: renderProgress })[S.tab](m);
}
function openDay(n){ S.view = n; save(); render(); window.scrollTo(0, 0); }

// ---------------- TODAY
function renderToday(m){
  const nd = nextDay();
  let h = '';
  if (nd === null) {
    h += '<h1>All 21 missions complete</h1><div class="alert good">Every mission is done. Use Repeat Offenders and the Progress tab to keep your weakest topics warm. Good luck in the test.</div>';
    m.innerHTML = h; return;
  }
  const D = dayOf(nd), p = planned(nd), lag = diffDays(today(), p);
  h += '<p class="muted small">Today’s mission · planned for ' + nice(p) + '</p>';
  h += '<h1>Day ' + nd + ': ' + esc(D.title) + '</h1>';
  h += '<p><span class="tag ' + D.area + '">' + areaName(D.area) + '</span> <span class="muted small">' + (D.paper ? 'about ' + D.paper.time + ' minutes' : 'about 20 minutes') + '</span></p>';
  if (lag > 0) h += '<div class="alert">You are ' + lag + ' day' + (lag > 1 ? 's' : '') + ' behind the plan. Do two missions today if you can, and prioritise the papers (Day 10 and Day 20).</div>';
  if (lag < 0 && nd === 1) h += '<div class="alert good">The plan starts on ' + nice(p) + '. Starting early is fine: the missions unlock in order, not by date.</div>';
  const st = S.stage[nd] || 0;
  h += '<button class="btn primary block" id="go">' + (st ? 'Continue: ' + stagesFor(D)[st] : 'Start mission') + '</button>';
  const offs = offenders();
  h += '<div class="card"><h3>How each day works</h3><ul><li><b>Warm-up</b>: three quick questions on yesterday’s topic. Tap to reveal.</li><li><b>Core drill</b>: the knowledge in marking-instruction wording, plus an annotated model answer.</li><li><b>Exam questions</b>: multiple choice with instant feedback, and typed answers you mark yourself against the scheme.</li><li><b>Boss question</b>: one A-grade extended response. Full marks earns +5 XP.</li></ul><p class="small muted">10 XP per mission, +5 for a full-marks boss, +1 per mark on the two papers. Anything you drop a mark on goes into Repeat Offenders automatically.</p></div>';
  if (offs.length) h += '<div class="card"><h3>Repeat Offenders: ' + offs.length + '</h3><p class="small">Questions you dropped marks on. Retry a few before today’s mission.</p><button class="btn block" id="gooff">Open the list</button></div>';
  m.innerHTML = h;
  $('#go').onclick = () => openDay(nd);
  if ($('#gooff')) $('#gooff').onclick = () => { S.tab = 'off'; save(); render(); };
}
function areaName(a){ return { design: 'Design', mm: 'Materials & manufacture', impact: 'Impact of technologies', paper: 'Assessment', review: 'Consolidation' }[a]; }

// ---------------- PLAN
function renderPlan(m){
  const nd = nextDay();
  let h = '<h1>21-day plan</h1><p class="muted small">Worked back from the test on ' + nice(parse(S.testDate)) + '. The mini-paper is Day 10; the full mock is Day 20, two days before the test, so Day 21 is left to fix what it shows. Change the test date in Settings.</p><div class="daylist">';
  DAYS.forEach(D => {
    const done = S.done[D.day], sc = dayScore(D);
    const r = done ? (sc.max ? sc.got + '/' + sc.max : '✓') : (D.day === nd ? 'Next' : '');
    h += '<button class="dayrow' + (done ? ' done' : '') + (D.day === nd ? ' next' : '') + '" data-d="' + D.day + '"><span class="n">' + (done ? '✓' : D.day) + '</span><span class="t">' + esc(D.title) + '<br><span class="s">Day ' + D.day + ' · ' + nice(planned(D.day)) + ' · ' + areaName(D.area) + '</span></span><span class="r">' + r + '</span></button>';
  });
  h += '</div><p class="small muted" style="margin-top:14px">Question-paper weighting in the course specification: design 30–50 marks, materials and manufacture 26–42, impact of technologies 4–8. The missions follow roughly the same balance.</p>';
  m.innerHTML = h;
  m.querySelectorAll('.dayrow').forEach(b => b.onclick = () => openDay(+b.dataset.d));
}

// ---------------- DAY VIEW
function renderDay(m, n){
  const D = dayOf(n), ST = stagesFor(D);
  let st = Math.min(S.stage[n] || 0, ST.length - 1);
  let h = '<button class="btn" id="back" style="min-height:36px;padding:6px 12px">← ' + (S.tab === 'plan' ? 'Plan' : 'Today') + '</button>';
  h += '<p class="muted small" style="margin-top:12px">Day ' + n + ' of ' + NDAYS + ' · ' + nice(planned(n)) + (S.done[n] ? ' · <b style="color:var(--good)">complete</b>' : '') + '</p><h1>' + esc(D.title) + '</h1>';
  h += '<div class="stagebar" style="grid-template-columns:repeat(' + ST.length + ',1fr)">' + ST.map((s, i) => '<button data-st="' + i + '" class="' + (i < st ? 'on' : i === st ? 'cur on' : '') + '"><div class="bar"></div><span class="lbl">' + s + '</span></button>').join('') + '</div>';
  h += '<div id="stage"></div>';
  m.innerHTML = h;
  $('#back').onclick = () => { S.view = null; save(); render(); window.scrollTo(0, 0); };
  m.querySelectorAll('.stagebar button').forEach(b => b.onclick = () => { S.stage[n] = +b.dataset.st; save(); render(); window.scrollTo(0, 0); });
  const box = $('#stage');
  const name = ST[st];
  if (name === 'Warm-up') stageWarm(box, D);
  else if (name === 'Core drill') stageCore(box, D);
  else if (name === 'Exam questions') stageExam(box, D);
  else if (name === 'Boss question') stageBoss(box, D);
  else if (name === 'Paper') stagePaper(box, D);
  else if (name === 'Repeat Offenders') { box.innerHTML = '<p>Everything you dropped a mark on across the whole plan. Read the full-marks answer, then retry: if you get it right now, it leaves the list.</p><div id="offl"></div>'; offList($('#offl')); }
  else if (name === 'Rules & weak spots') stageRules(box);
  else if (name === 'Night before') stageNight(box, D);
  // nav
  const nav = document.createElement('div'); nav.className = 'row'; nav.style.marginTop = '18px';
  if (st > 0) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = '← ' + ST[st - 1]; b.onclick = () => { S.stage[n] = st - 1; save(); render(); window.scrollTo(0, 0); }; nav.appendChild(b); }
  if (st < ST.length - 1) { const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = ST[st + 1] + ' →'; b.onclick = () => { S.stage[n] = st + 1; save(); render(); window.scrollTo(0, 0); }; nav.appendChild(b); }
  box.after(nav);
}

function stageWarm(box, D){
  let h = '<p class="muted small">' + (D.day === 1 ? 'Day 1 has no “yesterday”, so these warm-ups are on today’s content.' : 'Rapid recall from yesterday. Answer in your head, then tap to check.') + '</p>';
  D.warm.forEach((w, i) => { h += '<div class="card"><div class="q">' + (i + 1) + '. ' + w.q + '</div><div class="reveal"><button class="btn" data-rv>Reveal answer</button><div class="ans">' + w.a + '</div></div></div>'; });
  box.innerHTML = h;
  box.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => { b.parentNode.classList.toggle('open'); b.textContent = b.parentNode.classList.contains('open') ? 'Hide answer' : 'Reveal answer'; });
}

function modelHTML(mo){
  return '<div class="card model"><h3>Model answer, annotated <span class="mk">' + mo.max + ' marks</span></h3><p class="q">' + mo.q + '</p><p>' + mo.parts.map(([t, note]) => note ? '<span class="seg earn">' + t + '</span> <span class="note">✓ ' + note + '</span>' : '<span class="seg">' + t + '</span>').join('') + '</p><p class="small muted">Highlighted text is where each mark is earned.</p></div>';
}
function stageCore(box, D){
  const c = D.core; let h = '';
  c.cards.forEach(k => { h += '<div class="card"><h3>' + k.h + '</h3>' + (k.p.length > 1 ? '<ul>' + k.p.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '<p>' + k.p[0] + '</p>') + '</div>'; });
  if (c.svg && SVG[c.svg]) h += '<div class="card">' + SVG[c.svg] + '</div>';
  h += modelHTML(c.model);
  box.innerHTML = h;
}

function mcqHTML(q, idx){
  const a = S.ans[q.id], ord = order(q);
  let h = '<div class="card" id="c-' + q.id + '"><div class="small muted">' + (q.pick ? 'Which answer earns the mark?' : 'Question ' + idx) + ' · multiple choice</div><div class="q">' + q.q + '</div><div class="opts">';
  ord.forEach(i => {
    let cls = 'opt';
    if (a) { if (i === 0) cls += ' right'; else if (a.choice === i) cls += ' wrong'; }
    h += '<button class="' + cls + '" data-q="' + q.id + '" data-i="' + i + '"' + (a ? ' disabled' : '') + '>' + q.o[i] + '</button>';
  });
  h += '</div>';
  if (a) h += '<div class="why">' + (a.got ? '<b class="ok">Correct.</b> ' : '<b class="no">Not quite. Added to Repeat Offenders.</b> ') + q.why + '</div>';
  return h + '</div>';
}
function extHTML(q, label){
  const a = S.ans[q.id], open = a || S['open-' + q.id];
  let h = '<div class="card" id="c-' + q.id + '"><div class="small muted">' + label + '</div><div class="q">' + q.q + ' <span class="mk">' + q.max + ' mark' + (q.max > 1 ? 's' : '') + '</span></div>';
  h += '<textarea data-t="' + q.id + '" placeholder="Type your answer. Aim for one clear, different point per mark.">' + esc(S.texts[q.id] || '') + '</textarea>';
  if (!open) h += '<button class="btn block" data-open="' + q.id + '" style="margin-top:8px">Reveal marking scheme</button>';
  else {
    h += '<div class="scheme"><h4>Marking scheme</h4>';
    if (q.bands) h += q.bands.map(b => '<div class="box rule"><b>' + b[0] + ' marks</b>: ' + b[1] + '</div>').join('') + '<h4>Content likely to be referred to</h4>';
    h += '<ul>' + q.scheme.map(s => '<li>' + s + '</li>').join('') + '</ul>';
    if (q.rules) h += '<div class="box rule">' + q.rules.map(r => '• ' + r).join('<br>') + '</div>';
    h += '<h4>Full-marks answer</h4><div class="box full">' + q.model + '</div>';
    h += '<h4>Weak answer</h4><div class="box weak"><i>“' + q.weak + '”</i><br><b>Why it loses marks:</b> ' + q.weakWhy + '</div>';
    h += '<h4>How many marks did you earn?</h4><div class="marks">';
    for (let i = 0; i <= q.max; i++) h += '<button data-mk="' + q.id + '" data-v="' + i + '" class="' + (a && a.got === i ? 'sel' : '') + '">' + i + '</button>';
    h += '</div>';
    if (a) h += '<p class="small" style="margin-top:8px">' + (a.got === q.max ? '<b style="color:var(--good)">Full marks.</b>' : 'Saved: ' + a.got + '/' + q.max + '. This question is now in Repeat Offenders.') + '</p>';
    h += '</div>';
  }
  return h + '</div>';
}
function wire(box, after){
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const q = QIDX[b.dataset.q], i = +b.dataset.i;
    S.ans[q.id] = { got: i === 0 ? 1 : 0, max: 1, choice: i }; save(); after(q.id);
  });
  box.querySelectorAll('textarea[data-t]').forEach(t => t.oninput = () => { S.texts[t.dataset.t] = t.value; save(); });
  box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { S['open-' + b.dataset.open] = 1; save(); after(b.dataset.open); });
  box.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => {
    const q = QIDX[b.dataset.mk]; S.ans[q.id] = { got: +b.dataset.v, max: q.max }; save(); after(q.id);
  });
}
function refresh(id){ const y = document.getElementById('c-' + id); const top = y ? y.getBoundingClientRect().top : 0; render(); const z = document.getElementById('c-' + id); if (z) window.scrollBy(0, z.getBoundingClientRect().top - top); }

function stageExam(box, D){
  let h = '<p class="muted small">Multiple choice gives instant feedback. For typed questions, write your answer first, then reveal the scheme and mark yourself honestly: that is how you find the gaps.</p>';
  let i = 0; D.exam.forEach(q => { i++; h += q.t === 'mcq' ? mcqHTML(q, i) : extHTML(q, 'Question ' + i + ' · typed answer'); });
  box.innerHTML = h; wire(box, refresh);
}

function stageBoss(box, D){
  const q = D.boss, a = S.ans[q.id];
  let h = '<div class="alert">Boss question: the kind that separates an A from a B. Plan your points before you type (one per mark), and use the command word.</div>';
  h += extHTML(q, 'Boss question · extended response');
  const done = S.done[D.day];
  if (done) h += '<div class="alert good">Mission complete. +10 XP' + (done.bossFull ? ' +5 boss bonus' : '') + '.</div>';
  else h += '<button class="btn primary block" id="finish"' + (a ? '' : ' disabled') + '>' + (a ? 'Complete mission (+10 XP' + (a.got === q.max ? ', +5 boss bonus' : '') + ')' : 'Mark the boss question to finish') + '</button>';
  box.innerHTML = h; wire(box, refresh);
  const f = $('#finish'); if (f) f.onclick = () => complete(D, { bossFull: a && a.got === q.max });
}
function complete(D, extra){
  const sc = dayScore(D);
  S.done[D.day] = Object.assign({ date: ymd(today()), got: sc.got, max: sc.max }, extra || {});
  save(); toast('Day ' + D.day + ' complete'); render();
}

// ---------------- PAPERS
let timerInt = null;
function stagePaper(box, D){
  const P = D.paper; const res = S.papers[P.id];
  let h = '<div class="card"><h3>' + P.title + ' · ' + P.total + ' marks · ' + P.time + ' minutes</h3><p>' + P.intro + '</p><div class="row" style="align-items:center"><span class="timer" id="tm">' + fmt(timerLeft(P)) + '</span><button class="btn" id="tbtn">' + (S['tstart-' + P.id] ? 'Reset timer' : 'Start timer') + '</button></div></div>';
  let lastS = 0;
  P.questions.forEach(q => {
    if (P.sections && q.s !== lastS) {
      lastS = q.s; const sec = P.sections[q.s - 1];
      h += '<div class="sec">' + sec.name + ' · ' + sec.marks + ' marks</div>';
      if (sec.stimulus) { const st = STIMULUS[sec.stimulus]; h += '<div class="card"><h3>' + st.h + '</h3>' + st.p.map(x => '<p>' + x + '</p>').join('') + SVG[st.svg] + '</div>'; }
    }
    h += extHTML(q, 'Question ' + q.n + (q.holistic ? ' · marked holistically' : ''));
  });
  const sc = dayScore(D);
  h += '<div class="card"><h3>Your score</h3><p>' + sc.answered + ' of ' + sc.total + ' questions marked · <b>' + sc.got + '/' + P.total + '</b></p>';
  if (sc.answered === sc.total) {
    const pct = Math.round(100 * sc.got / P.total);
    h += '<div class="grade">' + grade(pct) + '</div><p>' + pct + '%. Indicative band using the 2025 Higher D&amp;M course boundaries as percentages (A 70%, B 60%, C 50%, D 40%). Those boundaries apply to the whole course (paper plus assignment), so treat this as a guide.</p>';
    if (!S.done[D.day]) h += '<button class="btn primary block" id="pfin">Finish paper (+10 XP, +' + sc.got + ' XP for marks)</button>';
    else h += '<div class="alert good">Paper recorded' + (res ? ': ' + res.got + '/' + res.max + ' (' + grade(Math.round(100 * res.got / res.max)) + ')' : '') + '. Dropped marks are in Repeat Offenders.</div>';
  } else h += '<p class="small muted">Mark every question to see your grade band.</p>';
  h += '</div>';
  box.innerHTML = h; wire(box, refresh);
  const pf = $('#pfin'); if (pf) pf.onclick = () => { S.papers[P.id] = { got: sc.got, max: P.total, date: ymd(today()) }; complete(D, { paperMarks: sc.got }); };
  $('#tbtn').onclick = () => { if (S['tstart-' + P.id]) delete S['tstart-' + P.id]; else S['tstart-' + P.id] = Date.now(); save(); refresh('x'); };
  clearInterval(timerInt);
  if (S['tstart-' + P.id]) timerInt = setInterval(() => { const t = $('#tm'); if (!t) return clearInterval(timerInt); t.textContent = fmt(timerLeft(P)); }, 1000);
}
function timerLeft(P){ const s = S['tstart-' + P.id]; const total = P.time * 60; if (!s) return total; return Math.max(0, total - Math.floor((Date.now() - s) / 1000)); }
function fmt(sec){ const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0') + ' left'; }

// ---------------- REVIEW DAY stages
function stageRules(box){
  let h = '<div class="card"><h3>Command-word rules</h3><table class="rules">' + RULES.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</table></div>';
  const ts = topicStats().slice(0, 5);
  h += '<div class="card"><h3>Your five weakest topics</h3>';
  if (!ts.length) h += '<p class="muted">No marks recorded yet.</p>';
  else h += '<p class="small muted">Re-read the core drill for each, then do its boss question again from memory.</p>' + ts.map(t => '<button class="dayrow" data-d="' + t.day + '" style="margin-top:8px"><span class="n">' + t.day + '</span><span class="t">' + esc(t.title) + '<br><span class="s">' + t.got + '/' + t.max + ' marks</span></span><span class="r">' + t.pct + '%</span></button>').join('');
  h += '</div>';
  box.innerHTML = h;
  box.querySelectorAll('.dayrow').forEach(b => b.onclick = () => { S.stage[+b.dataset.d] = 1; openDay(+b.dataset.d); });
}
function stageNight(box, D){
  let h = '<div class="card"><h3>Night-before routine</h3><ul>' + NIGHT_BEFORE.map(x => '<li>' + x + '</li>').join('') + '</ul></div>';
  if (S.done[D.day]) h += '<div class="alert good">Done. Stop now. Good luck tomorrow.</div>';
  else h += '<button class="btn primary block" id="rfin">Complete final mission (+10 XP)</button>';
  box.innerHTML = h;
  const f = $('#rfin'); if (f) f.onclick = () => complete(D, {});
}

// ---------------- OFFENDERS
function offList(el){
  const offs = offenders();
  if (!offs.length) { el.innerHTML = '<div class="alert good">No Repeat Offenders. Every question you have tried is at full marks.</div>'; return; }
  let h = '';
  offs.forEach(q => {
    const a = S.ans[q.id], D = dayOf(q.day);
    const where = q.paper ? (q.paper === 'mock' ? 'Mock paper' : 'Mini-paper') + ' Q' + q.n : 'Day ' + q.day + (q.isBoss ? ' boss' : '');
    h += '<div class="card"><div class="small muted">' + where + ' · ' + esc(dayOf(q.tp).title) + ' · you scored ' + a.got + '/' + a.max + '</div><div class="q">' + q.q + '</div>';
    h += '<div class="box full"><b>Full-marks answer:</b> ' + (q.t === 'mcq' ? q.o[0] + '<br><span class="small">' + q.why + '</span>' : q.model) + '</div>';
    h += '<button class="btn block" data-retry="' + q.id + '">Retry this question</button></div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => {
    const q = QIDX[b.dataset.retry]; delete S.ans[q.id]; delete S['open-' + q.id]; delete S.texts[q.id];
    const D = dayOf(q.day); const ST = stagesFor(D);
    S.stage[q.day] = q.paper ? 1 : q.isBoss ? 3 : ST.indexOf('Exam questions');
    save(); openDay(q.day);
    setTimeout(() => { const c = document.getElementById('c-' + q.id); if (c) c.scrollIntoView({ block: 'start' }); }, 50);
  });
}
function renderOffenders(m){
  m.innerHTML = '<h1>Repeat Offenders</h1><p class="muted small">Every question you drop a mark on lands here automatically. Retry it: full marks clears it. Day 21’s mission is built from this list.</p><div id="offl"></div>';
  offList($('#offl'));
}

// ---------------- PROGRESS
function bars(rows){
  return '<div class="bars">' + rows.map(r => '<div class="b" title="' + esc(r.lab) + ': ' + r.v + '"><span class="lab">' + esc(r.lab) + '</span><span class="val">' + r.v + '</span><div class="track"><div class="fill" style="width:' + Math.max(0, Math.min(100, r.pct)) + '%"></div></div></div>').join('') + '</div>';
}
function renderProgress(m){
  const done = Object.keys(S.done).length;
  let h = '<h1>Progress</h1><div class="stat"><div class="card"><div class="v">' + done + '<span class="small muted">/' + NDAYS + '</span></div><div class="l">days done</div></div><div class="card"><div class="v">' + xp() + '</div><div class="l">XP</div></div><div class="card"><div class="v">' + streak() + '</div><div class="l">day streak</div></div></div>';
  h += '<h2>Papers</h2><div class="card">';
  [['mini', 'Mini-paper (Day 10)', 30], ['mock', 'Full mock (Day 20)', 80]].forEach(([id, l, t]) => {
    const r = S.papers[id];
    h += '<p><b>' + l + '</b>: ' + (r ? r.got + '/' + r.max + ' · ' + Math.round(100 * r.got / r.max) + '% · grade ' + grade(Math.round(100 * r.got / r.max)) : '<span class="muted">not sat yet (' + t + ' marks)</span>') + '</p>';
  });
  h += '<p class="small muted">Bands use the 2025 course boundaries as percentages: A 70%, B 60%, C 50%, D 40%.</p></div>';
  const rows = DAYS.filter(D => dayScore(D).max).map(D => { const s = dayScore(D); return { lab: 'Day ' + D.day + ': ' + D.title, v: s.got + '/' + s.max, pct: 100 * s.got / s.max }; });
  h += '<h2>Marks per day</h2><div class="card">' + (rows.length ? bars(rows) : '<p class="muted">No marks yet.</p>') + '</div>';
  const ts = topicStats();
  h += '<h2>Topics, weakest first</h2><div class="card">' + (ts.length ? '<p class="small muted">Includes marks from both papers, filed under their topic.</p>' + bars(ts.map(t => ({ lab: 'Day ' + t.day + ': ' + t.title, v: t.pct + '%', pct: t.pct }))) : '<p class="muted">No marks yet.</p>') + '</div>';
  h += '<h2>Command-word rules</h2><div class="card"><table class="rules">' + RULES.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</table></div>';
  m.innerHTML = h;
}

// ---------------- ASSIGNMENT COACH
function renderCoach(m){
  let h = '<h1>Assignment coach</h1><div class="alert">' + COACH_GENERIC.intro + '</div>';
  h += '<div class="card"><h3>The rules for submission</h3><ul>' + COACH_GENERIC.rules.map(r => '<li>' + r + '</li>').join('') + '</ul></div>';
  const tot = COACH.reduce((a, c) => a + c.marks, 0);
  h += '<p class="small muted">' + COACH.length + ' assessed areas, ' + tot + ' marks. Tick the checklist against your own work; ticks are saved on this device only.</p>';
  COACH.forEach(c => {
    const ticks = S.coach[c.key] || [], n = ticks.filter(Boolean).length;
    h += '<details class="coach" data-k="' + c.key + '"' + (S['copen-' + c.key] ? ' open' : '') + '><summary>' + esc(c.name) + '<span class="m">' + c.marks + ' marks · ' + n + '/' + c.check.length + '</span></summary><div class="body">';
    h += '<div class="progress"><i style="width:' + (100 * n / c.check.length) + '%"></i></div>';
    h += '<h3 style="margin-top:10px">What the marks are for</h3><p>' + c.awarded + '</p>';
    h += '<h3 style="margin-top:12px">What separates the top band from the middle</h3><p>' + c.top + '</p>';
    h += '<h3 style="margin-top:12px">Self-check</h3>' + c.check.map((x, i) => '<label class="check"><input type="checkbox" data-ck="' + c.key + '" data-i="' + i + '"' + (ticks[i] ? ' checked' : '') + '><span>' + x + '</span></label>').join('');
    h += '</div></details>';
  });
  const e = COACH_GENERIC.example;
  h += '<div class="card"><h3>' + e.h + '</h3><div class="box weak"><b>Weak:</b> ' + e.weak + '<br><span class="small">' + e.weakWhy + '</span></div><div class="box full"><b>Strong:</b> ' + e.strong + '<br><span class="small">' + e.strongWhy + '</span></div></div>';
  h += '<p class="small muted">Sources: the specimen coursework assessment task (Sept 2023) marking instructions, the course specification (Aug 2019) and the 2025 course report.</p>';
  m.innerHTML = h;
  m.querySelectorAll('details.coach').forEach(d => d.addEventListener('toggle', () => { S['copen-' + d.dataset.k] = d.open ? 1 : 0; save(); }));
  m.querySelectorAll('[data-ck]').forEach(c => c.onchange = () => { const k = c.dataset.ck; S.coach[k] = S.coach[k] || []; S.coach[k][+c.dataset.i] = c.checked; save(); const d = c.closest('details'); const co = COACH.find(x => x.key === k); const n = S.coach[k].filter(Boolean).length; d.querySelector('.m').textContent = co.marks + ' marks · ' + n + '/' + co.check.length; d.querySelector('.progress i').style.width = (100 * n / co.check.length) + '%'; });
}

// ---------------- SETTINGS
$('#setBtn').onclick = () => {
  const d = $('#settings');
  d.innerHTML = '<h3>Settings</h3><label class="f" for="td">Test date</label><input type="date" id="td" value="' + S.testDate + '"><p class="small muted">The plan works back from this date: Day 20 (mock) is two days before, Day 21 the day before.</p><label class="f" for="th">Theme</label><select id="th"><option value="auto">Follow device</option><option value="light">Light</option><option value="dark">Dark</option></select><p class="small muted" style="margin-top:14px">Progress is saved in this browser on this device only. Clearing browser data or switching phone starts afresh.</p><div class="row" style="margin-top:14px"><button class="btn" id="rst">Reset all progress</button><button class="btn primary" id="cls">Done</button></div>';
  $('#th').value = S.theme;
  $('#td').onchange = e => { if (e.target.value) { S.testDate = e.target.value; save(); render(); } };
  $('#th').onchange = e => { S.theme = e.target.value; applyTheme(); save(); };
  $('#rst').onclick = () => { if (confirm('Delete all progress, marks and answers on this device?')) { const t = S.testDate, th = S.theme; S = blank(); S.testDate = t; S.theme = th; save(); d.close(); render(); toast('Progress reset'); } };
  $('#cls').onclick = () => d.close();
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
};

render();
})();

</script>
</body>
</html>
