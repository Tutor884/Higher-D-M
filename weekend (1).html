<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Higher D&amp;M: test weekend</title>
<meta name="description" content="Focused revision weekend for the Higher Design and Manufacture class test">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efede8; --ink:#1c1d1f; --ink-2:#4a4d52; --muted:#6f737a; --line:#dcd9d2;
  --accent:#2f5d8a; --accent-2:#1d3c5c; --accent-soft:#dfe8f1; --on-accent:#ffffff;
  --good:#1f7a4a; --good-soft:#dcf1e4; --bad:#b3372c; --bad-soft:#f8e0dc; --warn:#8a5a00; --warn-soft:#fbefd4;
  --mark:#fff1b8; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131416; --surface:#1c1e21; --surface-2:#25282c; --ink:#ecedef; --ink-2:#c3c6cb; --muted:#9398a0; --line:#34383d;
    --accent:#7fb0e0; --accent-2:#a9cbee; --accent-soft:#223549; --on-accent:#0d1620;
    --good:#6fd39c; --good-soft:#173726; --bad:#f2968b; --bad-soft:#3e1d1a; --warn:#f0c46b; --warn-soft:#3a2d12;
    --mark:#4a4020; --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1c1e21; --surface-2:#25282c; --ink:#ecedef; --ink-2:#c3c6cb; --muted:#9398a0; --line:#34383d;
  --accent:#7fb0e0; --accent-2:#a9cbee; --accent-soft:#223549; --on-accent:#0d1620;
  --good:#6fd39c; --good-soft:#173726; --bad:#f2968b; --bad-soft:#3e1d1a; --warn:#f0c46b; --warn-soft:#3a2d12;
  --mark:#4a4020; --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 0}
.brand{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand a{color:inherit;text-decoration:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;left:calc(50% + 8px);top:4px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}
main{padding:16px 0 24px}
h1{font-size:22px;line-height:1.25;margin:4px 0 6px}
h2{font-size:18px;margin:22px 0 8px}
h3{font-size:16px;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.card ul{margin:6px 0;padding-left:20px} .card li{margin:4px 0}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tag.mm{background:var(--warn-soft);color:var(--warn)}
.tag.design{background:var(--accent-soft);color:var(--accent-2)}
.tag.impact{background:var(--good-soft);color:var(--good)}
.tag.paper{background:var(--bad-soft);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;text-align:center;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.stagebar{display:grid;gap:4px;margin:10px 0 4px}
.stagebar button{border:0;background:none;padding:0;cursor:pointer;text-align:left;min-width:0}
.stagebar .bar{height:6px;border-radius:4px;background:var(--line)}
.stagebar .on .bar{background:var(--accent)} .stagebar .cur .bar{background:var(--accent-2)}
.stagebar .lbl{font-size:11px;color:var(--muted);margin-top:4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagebar .cur .lbl{color:var(--ink);font-weight:600}
.q{font-weight:600}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;min-height:44px;line-height:1.4}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}
.why b.ok{color:var(--good)} .why b.no{color:var(--bad)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;resize:vertical;margin-top:10px}
.scheme{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.scheme h4{margin:10px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.box{border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px}
.box.full{background:var(--good-soft)} .box.weak{background:var(--bad-soft)} .box.rule{background:var(--warn-soft)}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.marks button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.marks button.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mk{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.model .seg.earn{background:var(--mark);border-radius:3px;padding:0 2px}
.model .note{display:inline-block;font-size:12px;font-weight:600;color:var(--good);background:var(--good-soft);border-radius:6px;padding:0 6px;margin:0 2px}
.fig{margin:10px 0;color:var(--ink)} .fig svg{width:100%;height:auto;display:block} .fig figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.daylabel{margin:22px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.daylist{display:grid;gap:8px}
.dayrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.dayrow .n{font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.dayrow.done .n{color:var(--good)} .dayrow.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dayrow .t{font-weight:600;line-height:1.3;min-width:0}
.dayrow .s{font-size:12px;color:var(--muted);font-weight:400}
.dayrow .r{font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.alert{border-radius:12px;padding:10px 14px;margin:12px 0;background:var(--warn-soft);color:var(--ink)}
.alert.good{background:var(--good-soft)}
.alert.info{background:var(--accent-soft)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .card{margin:0;text-align:center;padding:12px 6px}
.stat .v{font-size:24px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:8px;margin-top:6px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:8px;align-items:center;font-size:14px}
.bars .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .track{grid-column:1/-1;height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:-4px}
.bars .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
.grade{font-size:36px;font-weight:800;color:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.sec{margin:22px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;max-width:min(420px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.4)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=date],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);min-height:44px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
table.t td:first-child{font-weight:600}
table.t.num td{font-variant-numeric:tabular-nums}
.qfscore{font-size:28px;font-weight:800}
.flip{perspective:1000px;margin:14px 0}
.flip .in{position:relative;height:230px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .emo{font-size:56px;line-height:1}
.face .big{font-size:20px;font-weight:700;margin-top:12px;line-height:1.3}
.face .sub{font-size:15px;color:var(--ink-2);margin-top:8px}
.hint{font-size:12px;color:var(--muted);margin-top:12px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;min-height:68px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile .te{font-size:22px}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.ok{border-color:var(--good);background:var(--good-soft);opacity:.5;cursor:default}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.answer{background:var(--surface-2);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{background:var(--warn-soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.confetti{position:fixed;top:-40px;font-size:26px;z-index:20;pointer-events:none;animation:fall 1.7s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.3}}
.stars{color:#e0a100;letter-spacing:1px;font-size:14px}
details.cheat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px;margin:16px 0}
details.cheat summary{cursor:pointer;font-weight:600;padding:14px 0}
details.cheat .card{box-shadow:none}
.bigstat{display:flex;justify-content:space-around;text-align:center;margin:8px 0}
.bigstat b{display:block;font-size:26px}

</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="topbar">
    <div class="brand">Higher D&amp;M · test weekend</div>
    <button class="iconbtn" id="themeBtn" aria-label="Change theme" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    <button class="iconbtn" id="setBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<script>
// ===================================================================== CONTENT
// MCQs: the correct option is always written FIRST; the app shuffles the display order.
const MC = (q, o, why) => ({ t: 'mcq', q, o, why });
const PK = (q, o, why) => ({ t: 'mcq', pick: true, q, o, why });
const EX = (x) => Object.assign({ t: 'ext' }, x);

const TEACHER_TOPICS = ['Material recognition', 'Manufacturing process recognition', 'Ergonomics', 'Aesthetics', 'The environment'];

const SESSIONS = [];

// --------------------------------------------------------------------- 1 MATERIALS
SESSIONS.push({
  id: 'mat', n: 1, when: 'Saturday', slot: '12:30–13:45', mins: 75, area: 'mm',
  title: 'Material recognition',
  goal: 'Name the exact material for any part from a photo or description, give a property with its consequence for that product, and describe how to identify a material by testing.',
  learn: [
    { h: 'How material questions earn marks', p: [
      '<b>Be specific.</b> “Polypropylene”, not “plastic”. “Mild steel”, not “metal”. “Beech”, not “wood”.',
      '<b>Property → consequence for this product.</b> The 2026 marking instructions (MI): “no marks awarded for simply stating properties”. <i>ABS is tough</i> = 0. <i>ABS is tough, so the controller casing will not crack if dropped</i> = 1.',
      '<b>The consequence must be real.</b> The MI gave 0 for “ABS is impact resistant as it can withstand being picked up and put down”, because being picked up does not need impact resistance.',
      '<b>Six marks need six different points.</b> Spread them across both products and several parts. Repeating the same property for a second part earns nothing.'
    ]},
    { h: 'Thermoplastics: soften when heated, can be reshaped and recycled', p: [
      '<b>ABS</b>: tough, impact and scratch resistant, glossy, any colour. Casings for electrical products, games controllers, toys.',
      '<b>Acrylic</b>: transparent, excellent optical clarity, hard, polishes well, weather resistant, but brittle (can shatter). Lenses, light diffusers, display cases, signs.',
      '<b>Nylon</b>: tough, hard-wearing, low friction (self-lubricating). Gears, bearings, zips, cable ties.',
      '<b>Polypropylene (PP)</b>: lightweight, tough, food safe, chemical resistant, fatigue resistant, so it forms a <i>living hinge</i>. Flip-top lids, food containers, stacking chairs.',
      '<b>Polystyrene</b>: rigid, light, cheap. Expanded (EPS) insulates and absorbs shock. Packaging, disposable cups, vacuum-formed trays.',
      '<b>Polythene</b>: LDPE is flexible (squeezy bottles, carrier bags). HDPE is stiffer and tough (milk bottles, bins, water tanks).',
      '<b>PVC</b>: durable, weather resistant, good electrical insulator, rigid or flexible. Window frames, drainpipes, cable insulation.'
    ]},
    { h: 'Thermosets, elastomers and composites', p: [
      '<b>Thermosets</b> set by a chemical change (cross-links) and cannot be softened again: rigid, heat resistant, good insulators.',
      '<b>Urea formaldehyde (UF)</b>: hard, rigid, excellent electrical insulator. Plugs, sockets, switches.',
      '<b>Melamine formaldehyde (MF)</b>: hard, scratch, heat and stain resistant, food safe. Tableware, laminate worktop surfaces.',
      '<b>Elastomers</b> (rubber, silicone) stretch or compress and return to shape: grips, seals, tyres, non-slip feet.',
      '<b>Carbon-fibre plastics</b>: very high strength-to-weight ratio, stiff, expensive. Racing bikes, rackets. <b>GRP</b>: strong, light, will not rot or corrode, large one-piece forms. Boat hulls, canoes.',
      'For composites the MI want an <b>enhanced property or a comparison to non-composite materials</b> (e.g. “lighter than a steel frame of the same strength”).'
    ]},
    { h: 'Metals', p: [
      '<b>Ferrous</b> (contain iron; most are magnetic; rust unless protected):',
      '<b>Mild steel</b>: tough, ductile, easily welded, cheap, but rusts, so it needs a finish (chrome plating, galvanising, dip coating). Frames, car bodies.',
      '<b>Stainless steel</b>: corrosion resistant, hard, hygienic, attractive. Cutlery, sinks, kettles.',
      '<b>Cast iron</b>: hard, brittle, strong in compression, casts well, heavy. Vice bodies, machine bases, manhole covers, cookware.',
      '<b>High-speed steel (HSS)</b>: stays hard at high temperatures. Drill bits, lathe tools.',
      '<b>Non-ferrous</b>: <b>Aluminium</b>: lightweight, corrosion resistant, extrudes and die casts well (window frames, bike frames, cans). <b>Copper</b>: excellent conductor of electricity and heat (wiring, pipes). <b>Brass</b> (copper + zinc): gold colour, corrosion resistant, casts and machines well (door handles, plumbing fittings). <b>Zinc</b>: galvanising, die-cast toys and handles. <b>Tin</b>: coating food cans, solder.'
    ]},
    { h: 'Woods and manufactured boards', p: [
      '<b>Oak</b>: strong, hard, durable, strong grain with silvery flecks; contains tannic acid, which corrodes steel fixings. Furniture, flooring, outdoor benches.',
      '<b>Beech</b>: hard, fine even grain, no taste or smell. Toys, kitchen utensils, chair frames.',
      '<b>Ash</b>: tough, flexible, shock resistant, steam bends. Tool handles, sports equipment.',
      '<b>Mahogany</b>: reddish-brown, stable, durable. Quality furniture, veneers.',
      '<b>Pine / spruce</b> (softwoods): light, cheap, fast growing; pine has knots. Construction, budget furniture.',
      '<b>Plywood</b>: veneers with grain at 90°, strong in all directions; layered edge. <b>MDF</b>: smooth, stable, routes cleanly, paints well. <b>Chipboard</b>: cheap, usually melamine faced; crumbly edges, poor screw holding. <b>Hardboard</b>: one smooth face; drawer bases, cabinet backs. <b>Blockboard</b>: stiff panels, shelving. <b>Flexiply</b>: bends to curves.'
    ]},
    { h: 'Recognition clues: what you can see in a photo', table: [
      ['You see…', 'It is probably…'],
      ['Clear, rigid, polished edges', 'Acrylic'],
      ['A thin strip that flexes as a hinge', 'Polypropylene'],
      ['Glossy, tough casing on an electrical product', 'ABS'],
      ['Squeezy bottle', 'LDPE'],
      ['Plug, socket or switch plate', 'Urea formaldehyde'],
      ['Hard, decorated picnic plates', 'Melamine formaldehyde'],
      ['Woven pattern under a glossy surface', 'Carbon fibre (or GRP)'],
      ['Dull grey crystalline “spangle” on steel', 'Galvanised mild steel'],
      ['Mirror finish on a handle or tap', 'Chrome-plated steel, zinc or ABS'],
      ['Gold-coloured metal fitting', 'Brass'],
      ['Orange-brown wire or pipe', 'Copper'],
      ['Strong grain with flecks, outdoor bench', 'Oak'],
      ['Pale, fine, even grain on a toy', 'Beech'],

// ---- Aesthetics: Homework Sheet 1
(function(){ const X = S_('aes'); X.hwref = 'Homework Sheet 1';
  X.learn.unshift({ h: 'Homework Sheet 1: your teacher’s questions', p: [
    '<b>“Aesthetically pleasing”</b>: a product that is pleasing to the senses, mainly to look at and touch. Its form, colour, texture and proportions make people like it and value it more, e.g. a sleek phone that looks premium.',
    '<b>Six aesthetic factors</b>: form (shape), colour, texture, proportion, balance, harmony/contrast. Also pattern, line and style.',
    '<b>Analysing a product</b>: go factor by factor and say what you see AND the effect: “The silver band contrasts with the black body, drawing the eye along the barrel and making it look professional.”'
  ]});
  X.g.rules[0] = 'Factor + where on the product + effect';
  X.g.cards.unshift(
    C('😍', '“Aesthetically pleasing” means…', 'Pleasing to look at and touch', 'Form, colour, texture etc. make us like and value it'),
    C('6️⃣', 'Name six aesthetic factors', 'Form, colour, texture, proportion, balance, contrast', 'Also harmony, pattern, line, style'),
    C('💨', 'Hairdryer: silver band on a black body', 'Contrast', 'Draws the eye and looks professional'),
    C('💨', 'Hairdryer: ribbed rubber handle', 'Texture', 'Looks and feels grippy'),
    C('💨', 'Hairdryer: smooth curved barrel', 'Form', 'Streamlined, looks powerful')
  );
  X.g.mark.unshift(
    MK('Hairdryer (Sheet 1): state what you find attractive and explain why.', 'I like the colour.', 0, 1, 'No detail of the colour and no effect.'),
    MK('Hairdryer (Sheet 1): state what you find attractive and explain why.', 'The silver band contrasts with the black body, which makes the barrel stand out and gives it a professional salon look.', 1, 1, 'Factor (contrast) + where + effect.')
  );
  X.spot.unshift(MC('Which is the best meaning of “aesthetically pleasing”?', ['Pleasing to the senses, especially to look at, so people value it', 'Easy and comfortable to use', 'Cheap to manufacture', 'Made from sustainable materials'], '“Easy and comfortable to use” is ergonomics, not aesthetics.'));
  X.exam.unshift(EX({ q: 'Homework Sheet 1, Q3: with reference to this hairdryer, state what you find most attractive and explain why. Break your answer down into aesthetic factors.' + HAIR, max: 6,
    scheme: ['Form: smooth, curved, streamlined barrel looks powerful and professional.', 'Colour: black and silver two-tone looks sleek and salon-quality.', 'Contrast: silver band against the black body draws the eye and highlights the brand name.', 'Texture: ribbed rubber handle looks grippy and contrasts with the gloss barrel.', 'Proportion: the long handle balances the large barrel, so it does not look top-heavy.', 'Line: flowing lines from the nozzle to the back suggest airflow and speed.', 'Style: professional salon styling appeals to buyers who want a high-quality product.'],
    rules: ['1 mark per aesthetic factor described with its effect.', 'Stating a colour or shape with no effect earns 0.', 'No repetition of the same factor.'],
    model: 'The barrel has a smooth, curved form that looks streamlined and powerful (1). The black and silver colour scheme looks sleek, like a professional salon dryer (1). The silver band contrasts with the black body, drawing the eye along the barrel to the brand name (1). The ribbed rubber handle has a texture that looks grippy and contrasts with the gloss of the barrel (1). The long angled handle is in proportion with the large barrel, so the dryer looks balanced rather than top-heavy (1). Its flowing lines from nozzle to back suggest fast airflow (1).',
    weak: 'I like it because it is black and silver and looks cool.',
    weakWhy: '0–1 mark. Colours are listed but there is no factor-by-factor explanation of the effect.' }));
})();

// ---- Ergonomics: Homework Sheet 2
(function(){ const X = S_('erg'); X.hwref = 'Homework Sheet 2';
  X.learn.unshift({ h: 'Homework Sheet 2: your teacher’s questions', p: [
    '<b>Anthropometrics</b>: the study of human body measurements (heights, reach, grip, hand sizes) used to size products.',
    '<b>Physiology</b>: the study of the body’s physical abilities and limits (strength, movement, comfort, fatigue). Products are designed to reduce strain.',
    '<b>Psychology</b>: how the senses and mind respond to a product (colours, sounds, textures, feeling safe).',
    '<b>Chair design</b>: seat height from popliteal height; seat depth from buttock-popliteal length; seat width from hip width (95th percentile); backrest supports the lower back to reduce strain.',
    '<b>Child’s high chair</b> (wooden frame, tray, strap between the legs, footrest): tray height suits a toddler’s seated elbow height; the strap stops the child sliding out; the footrest supports the legs, reducing fatigue; rounded edges and a padded seat feel safe and comfortable.'
  ]});
  X.g.cards.unshift(
    C('📐', 'Anthropometrics is…', 'The study of body measurements', 'Used to size products'),
    C('💪', 'Physiology is…', 'The body’s physical abilities and limits', 'Strength, movement, comfort, fatigue'),
    C('🧠', 'Psychology is…', 'How the senses and mind respond', 'Colour, sound, feel, feeling safe'),
    C('🪑', 'Chair seat height is based on…', 'Popliteal height', 'Feet flat on the floor'),
    C('🪑', 'Chair seat depth is based on…', 'Buttock-popliteal length', 'Seat edge doesn’t press behind the knee'),
    C('🪑', 'Chair seat width is based on…', 'Hip width, 95th percentile', 'The widest users fit'),
    C('👶', 'High chair tray height is based on…', 'Toddler’s seated elbow height', 'Child reaches food comfortably'),
    C('👶', 'High chair footrest', 'Supports the legs', 'Reduces fatigue (physiology)')
  );
  X.g.mark.unshift(
    MK('Describe what is meant by anthropometrics.', 'It is about the human body.', 0, 1, 'Too vague: it is the study of body MEASUREMENTS used to size products.'),
    MK('Describe what is meant by anthropometrics.', 'The study of human body measurements, such as hand size, so a handle can be sized to fit the user’s grip.', 1, 1, 'Correct definition with an example.')
  );
  X.spot.unshift(MC('Which describes physiology?', ['The body’s physical abilities and limits, such as strength and fatigue', 'Measurements of the human body', 'How the senses respond to colour and sound', 'How attractive a product looks'], 'Measurements = anthropometrics. Senses = psychology.'));
  X.exam.unshift(
    EX({ q: 'Homework Sheet 2, Q1: describe what is meant by anthropometrics, physiology and psychology in relation to ergonomics. Refer to familiar products.', max: 6,
      scheme: ['Anthropometrics: study of human body measurements.', 'Anthropometrics example: handle diameter from grip diameter; seat height from popliteal height.', 'Physiology: the body’s physical abilities and limits (strength, movement, fatigue).', 'Physiology example: padded straps on a backpack reduce pressure on the shoulders.', 'Psychology: how the senses and mind respond to a product.', 'Psychology example: a red stop button signals danger; a kettle clicks off to show it has boiled.'],
      rules: ['1 mark for each definition, 1 mark for each valid product example (maximum 2 per area).'],
      model: 'Anthropometrics is the study of human body measurements (1), for example the diameter of a drill handle is based on the grip diameter of an adult hand (1). Physiology is about the body’s physical abilities and limits, such as strength and fatigue (1), for example a backpack has padded straps to reduce pressure on the shoulders (1). Psychology is how the senses and mind respond to a product (1), for example a red emergency stop button signals danger so the user reacts quickly (1).',
      weak: 'Anthropometrics is sizes, physiology is the body and psychology is the mind.',
      weakWhy: '1–2 marks at most. The definitions are thin and there are no product examples.' }),
    EX({ q: 'Homework Sheet 2, Q3: a child’s high chair has a wooden frame, a tray, a strap between the legs and a footrest. Give examples of the use of ergonomics in its design.', max: 3,
      scheme: ['Tray height based on a toddler’s seated elbow height, so food can be reached.', 'Seat width based on a toddler’s hip width.', 'Footrest supports the legs, reducing fatigue.', 'Strap between the legs stops the child sliding out, so they feel secure.', 'Rounded, smooth edges so the child is not hurt; feels safe to parents.', 'Tray removable/at a height a parent can reach easily.'],
      rules: ['1 mark per valid example with its reason.'],
      model: 'The tray height is based on the seated elbow height of a toddler, so the child can reach their food comfortably (1). The footrest supports the child’s legs so they do not dangle, reducing fatigue (1). The strap between the legs stops the child sliding down under the tray, so they are held securely (1).',
      weak: 'It is the right size for a baby and it is safe.',
      weakWhy: '0 marks. No specific part of the chair is linked to a body measurement or a reason.' })
  );
})();

// ---- Environment: Homework Sheet 4 (obsolescence and redundancy)
(function(){ const X = S_('env'); X.hwref = 'Homework Sheet 4';
  X.learn.unshift({ h: 'Homework Sheet 4: obsolescence and redundancy', p: [
    '<b>Planned obsolescence</b>: a product is deliberately designed to have a limited life (to fail, wear out or become unsupported) so the customer has to buy a replacement. Examples: glued-in phone batteries, printer cartridges with chips that stop refills, software updates ending.',
    '<b>Consequences</b>: the consumer pays more often; the manufacturer gets repeat sales but risks its reputation; the environment gets more waste, and more raw materials and energy are used for replacements.',
    '<b>Perceived obsolescence</b>: the product still works, but the owner sees it as out of date because of fashion, styling, or a newer model being marketed. Examples: upgrading a working phone for the new model, last season’s trainers, clothes.',
    '<b>Redundancy</b>: a product is no longer needed or used, usually because new technology has replaced it. It is the end of the product life cycle (decline stage). Examples: VHS recorders, floppy disks, fax machines, pagers, cassette players, film cameras.'
  ]});
  X.g.cards.unshift(
    C('⏳', 'Designed to fail or go out of date so you buy again', 'Planned obsolescence', 'Deliberate limited life'),
    C('👟', 'Still works, but feels out of date', 'Perceived obsolescence', 'Fashion or a new model makes it feel old'),
    C('🦕', 'No longer needed: replaced by new technology', 'Redundancy', 'End of the product life cycle'),
    C('🖨️', 'Printer cartridge chipped to stop refills', 'Planned obsolescence', 'Forces a repeat purchase'),
    C('📱', 'Swapping a working phone for the new model', 'Perceived obsolescence', 'Marketing and fashion drive it'),
    C('📼', 'VHS video recorder', 'Redundant', 'Replaced by DVD, then streaming'),
    C('💾', 'Floppy disk', 'Redundant', 'Replaced by USB sticks and the cloud'),
    C('📠', 'Fax machine', 'Redundant', 'Replaced by email')
  );

<script>
(function(){
'use strict';
const KEY = 'hdm-weekend-v1';
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function blank(){ return { theme: 'auto', testDate: '2026-11-04', ans: {}, texts: {}, open: {}, stage: {}, done: {}, hw: false, night: {}, qfBest: 0, fc: {}, match: {}, tstart: 0, tab: 'plan', view: null }; }
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const ALL = [...SESSIONS, TEST, NIGHT];
const byId = id => ALL.find(x => x.id === id);
const QIDX = {};
SESSIONS.forEach(X => {
  X.spot.forEach((q, i) => { q.id = X.id + '-s' + i; q.sid = X.id; q.tp = X.id; q.kind = 'spot'; QIDX[q.id] = q; });
  X.exam.forEach((q, i) => { q.id = X.id + '-e' + i; q.sid = X.id; q.tp = X.id; q.kind = 'exam'; QIDX[q.id] = q; });
  X.g.mark.forEach((q, i) => { q.id = X.id + '-m' + i; q.sid = X.id; q.tp = X.id; q.kind = 'mark'; QIDX[q.id] = q; });
  X.boss.id = X.id + '-b'; X.boss.sid = X.id; X.boss.tp = X.id; X.boss.kind = 'boss'; QIDX[X.boss.id] = X.boss;
});
TEST.questions.forEach(q => { q.id = 'test-' + q.n; q.sid = 'test'; q.kind = 'test'; QIDX[q.id] = q; });
const SPOTPOOL = SESSIONS.flatMap(X => X.spot);

function stagesFor(X){ return X.id === 'test' ? ['Test'] : X.id === 'night' ? ['Rules', 'Repeat Offenders', 'Checklist'] : ['Flashcards', 'Match', 'Spot it', 'Mark it', 'Exam']; }
function qMax(q){ return q.t === 'ext' ? q.max : 1; }
function sessQs(X){ return X.id === 'test' ? TEST.questions : X.id === 'night' ? [] : [...X.spot, ...X.g.mark, ...X.exam, X.boss]; }
function score(X){ let g = 0, m = 0, n = 0; const qs = sessQs(X); qs.forEach(q => { const a = S.ans[q.id]; if (a) { g += a.got; m += a.max; n++; } }); return { got: g, max: m, answered: n, total: qs.length }; }
function offenders(){ return Object.keys(S.ans).filter(id => QIDX[id] && S.ans[id].got < S.ans[id].max).map(id => QIDX[id]); }
function nextId(){ for (const X of ALL) if (!S.done[X.id]) return X.id; return null; }
function xp(){ let x = 0; Object.keys(S.ans).forEach(id => { x += S.ans[id].got * 10; }); Object.values(S.fc).forEach(a => { x += a.length * 2; }); Object.values(S.match).forEach(m => { x += m.rounds * 20; }); return x; }
function stars(X){
  if (!X.g) return '';
  const sp = X.spot.filter(q => S.ans[q.id]), ok = sp.filter(q => S.ans[q.id].got).length;
  const n = (S.match[X.id] ? 1 : 0) + (sp.length === X.spot.length && ok / sp.length >= 0.75 ? 1 : 0) + (S.done[X.id] ? 1 : 0);
  return '<span class="stars">' + '★'.repeat(n) + '☆'.repeat(3 - n) + '</span>';
}
function confetti(){ const em = ['🎉', '⭐', '✨', '🏆', '💥']; for (let i = 0; i < 28; i++) { const d = document.createElement('div'); d.className = 'confetti'; d.textContent = em[i % em.length]; d.style.left = Math.random() * 100 + 'vw'; d.style.animationDelay = Math.random() * 0.5 + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); } }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function grade(p){ return p >= 70 ? 'A' : p >= 60 ? 'B' : p >= 50 ? 'C' : p >= 40 ? 'D' : 'No award'; }
function topicStats(){
  return SESSIONS.map(X => {
    let g = 0, m = 0;
    Object.keys(S.ans).forEach(id => { const q = QIDX[id]; if (q && q.tp === X.id) { g += S.ans[id].got; m += S.ans[id].max; } });
    return { id: X.id, title: X.title, got: g, max: m, pct: m ? Math.round(100 * g / m) : null };
  });
}

function seeded(str){ let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }
function order(q, salt){ const r = seeded(q.id + (salt || '')), a = q.o.map((_, i) => i); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function applyTheme(){ const r = document.documentElement; if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme); }

$('#themeBtn').onclick = () => { S.theme = S.theme === 'auto' ? 'light' : S.theme === 'light' ? 'dark' : 'auto'; applyTheme(); save(); toast('Theme: ' + (S.theme === 'auto' ? 'follow device' : S.theme)); };
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

function today(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parse(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function chips(){

}

const ICON = {
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

function render(){

  const m = $('#main');

function areaName(a){ return { mm: 'Materials & manufacture', design: 'Design', impact: 'Impact', paper: 'Assessment', review: 'Review' }[a]; }

// ---------------- PLAN
function renderPlan(m){
  const nx = nextId();
  let h = '<h1>Test weekend</h1>';

function renderSession(m, id){

  if (name === 'Flashcards') stageCards(box, X);
  else if (name === 'Match') stageMatch(box, X);
  else if (name === 'Spot it') stageSpot(box, X);
  else if (name === 'Mark it') stageMark(box, X);
  else if (name === 'Exam') stageBoss(box, X);
  else if (name === 'Test') stageTest(box);
  else if (name === 'Rules') stageRules(box);
  else if (name === 'Repeat Offenders') { box.innerHTML = '<p>Everything you dropped a mark on this weekend. Read the full-marks answer, then retry it.</p><div id="offl"></div>'; offList($('#offl')); }
  else if (name === 'Checklist') stageChecklist(box);
  const nav = document.createElement('div'); nav.className = 'row'; nav.style.marginTop = '18px';
  if (st > 0) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = '← ' + ST[st - 1]; b.onclick = () => { S.stage[id] = st - 1; save(); render(); window.scrollTo(0, 0); }; nav.appendChild(b); }
  if (st < ST.length - 1) { const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = ST[st + 1] + ' →'; b.onclick = () => { S.stage[id] = st + 1; save(); render(); window.scrollTo(0, 0); }; nav.appendChild(b); }
  if (nav.children.length) box.after(nav);
}

function cardHTML(k){
  let h = '<div class="card"><h3>' + k.h + '</h3>';

  if (k.table) h += '<table class="t' + (k.num ? ' num' : '') + '"><tr>' + k.table[0].map(c => '<th>' + c + '</th>').join('') + '</tr>' + k.table.slice(1).map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</table>';
  if (k.note) h += '<p class="small muted" style="margin-top:8px">' + k.note + '</p>';

}
function modelHTML(mo){
  return '<div class="card model"><h3>Model answer, annotated <span class="mk">' + mo.max + ' marks</span></h3><p class="q">' + mo.q + '</p><p>' + mo.parts.map(([t, note]) => '<span class="seg earn">' + t + '</span> <span class="note">✓ ' + note + '</span>').join('') + '</p><p class="small muted">Each highlight is one mark earned.</p></div>';

function cheatHTML(X){ return '<details class="cheat"><summary>📖 Cheat sheet: full notes and a model answer</summary>' + X.learn.map(cardHTML).join('') + modelHTML(X.model) + '</details>'; }
const FCQ = {};
function stageCards(box, X){
  const G = X.g, known = S.fc[X.id] || [];
  if (!FCQ[X.id]) FCQ[X.id] = shuffle(G.cards.map((_, i) => i).filter(i => known.indexOf(i) < 0));
  const q = FCQ[X.id], n = G.cards.length;

  h += '<div class="progress" style="height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:12px 0 4px"><i style="display:block;height:100%;background:var(--good);width:' + (100 * known.length / n) + '%"></i></div><p class="small muted">' + known.length + ' of ' + n + ' known · guess the answer, then tap the card</p>';
  if (!q.length) h += '<div class="card" style="text-align:center"><div style="font-size:48px">🎉</div><h3>All ' + n + ' cards known</h3><p class="muted small">Next: beat the clock in Match.</p><button class="btn" id="fcreset">Shuffle and go again</button></div>';
  else {
    const c = G.cards[q[0]];
    h += '<div class="flip" id="fl"><div class="in"><div class="face"><div class="emo">' + c.e + '</div><div class="big">' + c.f + '</div><div class="hint">Say your answer, then tap to flip</div></div><div class="face back"><div class="big">' + c.b + '</div><div class="sub">' + c.w + '</div></div></div></div>';
    h += '<div class="row"><button class="btn" id="again">🔁 Again</button><button class="btn primary" id="got">✓ Got it</button></div>';
  }
  h += cheatHTML(X);
  box.innerHTML = h;
  const fl = $('#fl'); if (fl) fl.onclick = () => fl.classList.toggle('on');
  if ($('#got')) $('#got').onclick = () => { const i = q.shift(); S.fc[X.id] = known.concat([i]); save(); if (!q.length) confetti(); render(); };
  if ($('#again')) $('#again').onclick = () => { q.push(q.shift()); render(); };
  if ($('#fcreset')) $('#fcreset').onclick = () => { S.fc[X.id] = []; FCQ[X.id] = null; save(); render(); };
}
const MT = {};
function newMatch(X){
  const seen = new Set(), pick = [];
  shuffle(X.g.cards).forEach(c => { if (pick.length < 5 && !seen.has(c.b)) { seen.add(c.b); pick.push(c); } });
  MT[X.id] = { p: pick, L: shuffle([0, 1, 2, 3, 4]), R: shuffle([0, 1, 2, 3, 4]), sel: null, ok: [], miss: 0, bad: null, t0: Date.now() };
}
function stageMatch(box, X){
  if (!MT[X.id]) newMatch(X);
  const M = MT[X.id], rec = S.match[X.id];
  let h = '<p class="small muted">Tap a card on the left, then its match on the right. Fast and accurate wins.' + (rec ? ' Best: <b>' + rec.best + 's</b> · ' + rec.rounds + ' round' + (rec.rounds > 1 ? 's' : '') + ' played.' : '') + '</p>';
  if (M.ok.length === 5) {
    const t = M.secs;
    h += '<div class="card" style="text-align:center"><div style="font-size:48px">' + (M.miss === 0 ? '🏆' : '✅') + '</div><h3>Round complete</h3><div class="bigstat"><div><b>' + t + 's</b><span class="small muted">time</span></div><div><b>' + M.miss + '</b><span class="small muted">mistakes</span></div><div><b>+20</b><span class="small muted">XP</span></div></div><button class="btn primary block" id="mnew">Play another round</button></div>';
  } else {
    h += '<div class="match"><div class="col">' + M.L.map(i => { const c = M.p[i], ok = M.ok.indexOf(i) >= 0, sel = M.sel && M.sel.s === 'L' && M.sel.i === i; return '<button class="tile' + (ok ? ' ok' : sel ? ' sel' : '') + (M.bad && M.bad.s === 'L' && M.bad.i === i ? ' bad' : '') + '" data-s="L" data-i="' + i + '"' + (ok ? ' disabled' : '') + '><span class="te">' + c.e + '</span>' + c.f + '</button>'; }).join('') + '</div>';
    h += '<div class="col">' + M.R.map(i => { const c = M.p[i], ok = M.ok.indexOf(i) >= 0, sel = M.sel && M.sel.s === 'R' && M.sel.i === i; return '<button class="tile' + (ok ? ' ok' : sel ? ' sel' : '') + (M.bad && M.bad.s === 'R' && M.bad.i === i ? ' bad' : '') + '" data-s="R" data-i="' + i + '"' + (ok ? ' disabled' : '') + '>' + c.b + '</button>'; }).join('') + '</div></div>';
  }
  box.innerHTML = h;
  box.querySelectorAll('.tile[data-s]').forEach(b => b.onclick = () => {
    const s = b.dataset.s, i = +b.dataset.i; M.bad = null;
    if (!M.sel || M.sel.s === s) { M.sel = { s, i }; render(); return; }
    if (M.sel.i === i) {
      M.ok.push(i); M.sel = null;
      if (M.ok.length === 5) {
        M.secs = Math.round((Date.now() - M.t0) / 1000);
        const r = S.match[X.id] || { rounds: 0, best: 999 }; r.rounds++; r.best = Math.min(r.best, M.secs); S.match[X.id] = r; save(); confetti();
      }
    } else { M.miss++; M.bad = { s, i }; M.sel = null; setTimeout(() => { if (M.bad) { M.bad = null; render(); } }, 450); }
    render();
  });
  if ($('#mnew')) $('#mnew').onclick = () => { newMatch(X); render(); };
}
function stageMark(box, X){
  const qs = X.g.mark, done = qs.filter(q => S.ans[q.id]), ok = done.filter(q => S.ans[q.id].got).length;
  let h = '<p class="small muted">Be the examiner. How many marks does each answer get? <b>' + ok + '/' + done.length + '</b> judged correctly.</p>';
  qs.forEach((q, n) => {
    const a = S.ans[q.id];
    h += '<div class="card" id="c-' + q.id + '"><div class="small muted">Answer ' + (n + 1) + ' of ' + qs.length + '</div><div class="q">' + q.q + ' <span class="mk">' + q.max + ' mark' + (q.max > 1 ? 's' : '') + '</span></div><div class="answer">“' + q.a + '”</div><div class="marks">';
    for (let i = 0; i <= q.max; i++) { let cls = ''; if (a) { if (i === q.m) cls = ' style="background:var(--good-soft);border-color:var(--good)"'; else if (a.choice === i) cls = ' style="background:var(--bad-soft);border-color:var(--bad)"'; } h += '<button data-mark="' + q.id + '" data-v="' + i + '"' + cls + (a ? ' disabled' : '') + '>' + i + '</button>'; }
    h += '</div>';
    if (a) h += '<div class="why">' + (a.got ? '<b class="ok">Spot on.</b> ' : '<b class="no">It gets ' + q.m + '.</b> ') + q.why + '</div>';

  });
  box.innerHTML = h;
  box.querySelectorAll('[data-mark]').forEach(b => b.onclick = () => { const q = QIDX[b.dataset.mark], v = +b.dataset.v; S.ans[q.id] = { got: v === q.m ? 1 : 0, max: 1, choice: v }; save(); refresh(q.id); });
}

function mcqHTML(q, label){
  const a = S.ans[q.id], ord = order(q);
  let h = '<div class="card" id="c-' + q.id + '"><div class="small muted">' + label + '</div><div class="q">' + q.q + '</div><div class="opts">';

  });
  h += '</div>';
  if (a) h += '<div class="why">' + (a.got ? '<b class="ok">Correct.</b> ' : '<b class="no">Not quite. Added to Repeat Offenders.</b> ') + q.why + '</div>';

function extHTML(q, label){

    h += '</div>';
    if (a) h += '<p class="small" style="margin-top:8px">' + (a.got === q.max ? '<b style="color:var(--good)">Full marks.</b>' : 'Saved: ' + a.got + '/' + q.max + '. Now in Repeat Offenders.') + '</p>';

function wire(box){
  box.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => { const q = QIDX[b.dataset.q], i = +b.dataset.i; S.ans[q.id] = { got: i === 0 ? 1 : 0, max: 1, choice: i }; save(); refresh(q.id); });
  box.querySelectorAll('textarea[data-t]').forEach(t => t.oninput = () => { S.texts[t.dataset.t] = t.value; save(); });
  box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { S.open[b.dataset.open] = 1; save(); refresh(b.dataset.open); });
  box.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => { const q = QIDX[b.dataset.mk]; S.ans[q.id] = { got: +b.dataset.v, max: q.max }; save(); refresh(q.id); });
}
function refresh(id){ const y = document.getElementById('c-' + id); const top = y ? y.getBoundingClientRect().top : 0; render(); const z = document.getElementById('c-' + id); if (z) window.scrollBy(0, z.getBoundingClientRect().top - top); }

function stageSpot(box, X){
  const sc = X.spot.filter(q => S.ans[q.id]).length, ok = X.spot.filter(q => S.ans[q.id] && S.ans[q.id].got).length;

}

// ---------------- TEST
let tint = null;
function left(){ const total = TEST.time * 60; if (!S.tstart) return total; return Math.max(0, total - Math.floor((Date.now() - S.tstart) / 1000)); }
function fmt(sec){ const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0') + ' left'; }
function stageTest(box){
  let h = '<div class="card"><h3>' + TEST.total + ' marks · ' + TEST.time + ' minutes</h3><p>' + TEST.intro + '</p><div class="row" style="align-items:center"><span class="timer" id="tm">' + fmt(left()) + '</span><button class="btn" id="tbtn">' + (S.tstart ? 'Reset timer' : 'Start timer') + '</button></div></div>';
  let lastS = 0;
  TEST.questions.forEach(q => {
    if (q.s !== lastS) {
      lastS = q.s;
      h += '<div class="sec">Section ' + (q.s === 1 ? 'A · 25 marks' : 'B · 25 marks') + '</div>';
      if (q.s === 1) h += '<div class="card"><h3>' + TEST.stimulus.h + '</h3>' + TEST.stimulus.p.map(x => '<p>' + x + '</p>').join('') + '</div>';
    }
    h += extHTML(q, 'Question ' + q.n);
  });
  const sc = score(TEST);
  h += '<div class="card"><h3>Your score</h3><p>' + sc.answered + ' of ' + sc.total + ' questions marked · <b>' + sc.got + '/' + TEST.total + '</b></p>';
  if (sc.answered === sc.total) {
    const pct = Math.round(100 * sc.got / TEST.total);
    h += '<div class="grade">' + grade(pct) + '</div><p>' + pct + '%. A guide using SQA’s notional boundaries (A 70%, B 60%, C 50%, D 40%). Your teacher’s test may be graded differently.</p>';
    if (!S.done.test) h += '<button class="btn primary block" id="tfin">Record test result</button>';
    else h += '<div class="alert good">Result recorded. Dropped marks are in Repeat Offenders: clear them before the test.</div>';
  } else h += '<p class="small muted">Mark every question to see your grade band.</p>';
  h += '</div>';
  box.innerHTML = h; wire(box);
  const f = $('#tfin'); if (f) f.onclick = () => { S.done.test = { at: Date.now() }; save(); toast('Test recorded'); render(); };
  $('#tbtn').onclick = () => { S.tstart = S.tstart ? 0 : Date.now(); save(); render(); };
  clearInterval(tint);
  if (S.tstart) tint = setInterval(() => { const t = $('#tm'); if (!t) return clearInterval(tint); t.textContent = fmt(left()); }, 1000);
}

// ---------------- NIGHT
function rulesTable(){ return '<table class="t">' + RULES.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</table>'; }
function stageRules(box){

// ---------------- QUICK-FIRE
let QF = null;
function newRound(){ const pool = SPOTPOOL.slice(); for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; } QF = { qs: pool.slice(0, 10), i: 0, right: 0, pick: null, salt: String(Math.random()) }; }
function renderQuick(m){
  if (!QF) {
    m.innerHTML = '<h1>Quick-fire</h1><p class="muted">Ten random questions from all the topics and your homework. Use it for 5 minutes at the start of each session, or on the bus. Best score: <b>' + S.qfBest + '/10</b>.</p><button class="btn primary block" id="qs">Start a round</button>';
    $('#qs').onclick = () => { newRound(); render(); };
    return;
  }
  if (QF.i >= QF.qs.length) {
    if (QF.right > S.qfBest) { S.qfBest = QF.right; save(); }
    m.innerHTML = '<h1>Round complete</h1><div class="card" style="text-align:center"><div class="qfscore">' + QF.right + '/10</div><p class="muted">Best: ' + S.qfBest + '/10</p></div><div class="row"><button class="btn primary" id="again">Another round</button><button class="btn" id="stop">Done</button></div>';

    $('#stop').onclick = () => { QF = null; render(); };

  }

  let h = '<p class="muted small">Question ' + (QF.i + 1) + ' of 10 · ' + esc(X.title) + ' · ' + QF.right + ' right</p><div class="card"><div class="q">' + q.q + '</div><div class="opts">';
  ord.forEach(i => { let cls = 'opt'; if (QF.pick !== null) { if (i === 0) cls += ' right'; else if (QF.pick === i) cls += ' wrong'; } h += '<button class="' + cls + '" data-i="' + i + '"' + (QF.pick !== null ? ' disabled' : '') + '>' + q.o[i] + '</button>'; });
  h += '</div>';
  if (QF.pick !== null) h += '<div class="why">' + (QF.pick === 0 ? '<b class="ok">Correct.</b> ' : '<b class="no">Not quite.</b> ') + q.why + '</div>';

  if ($('#nx')) $('#nx').onclick = () => { QF.i++; QF.pick = null; render(); window.scrollTo(0, 0); };
}

// ---------------- OFFENDERS
function offList(el){
  const offs = offenders();
  if (!offs.length) { el.innerHTML = '<div class="alert good">No Repeat Offenders. Everything you have tried is at full marks.</div>'; return; }
  let h = '';
  offs.forEach(q => {
    const a = S.ans[q.id], X = byId(q.sid);
    const where = q.kind === 'test' ? 'Practice test Q' + q.n : X.title + ' · ' + ({ spot: 'Spot it', mark: 'Mark it', exam: 'Exam', boss: 'Boss question' })[q.kind];
    h += '<div class="card"><div class="small muted">' + esc(where) + ' · you scored ' + a.got + '/' + a.max + '</div><div class="q">' + q.q + '</div>';
    h += '<div class="box full"><b>Full-marks answer:</b> ' + (q.t === 'mcq' ? q.o[0] + '<br><span class="small">' + q.why + '</span>' : q.t === 'mark' ? '“' + q.a + '” gets ' + q.m + '/' + q.max + '. ' + q.why : q.model) + '</div>';
    h += '<button class="btn block" data-retry="' + q.id + '">Retry this question</button></div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => {
    const q = QIDX[b.dataset.retry]; delete S.ans[q.id]; delete S.open[q.id]; delete S.texts[q.id];
    S.stage[q.sid] = q.kind === 'test' ? 0 : ({ spot: 2, mark: 3, exam: 4, boss: 4 })[q.kind];
    save(); open(q.sid);
    setTimeout(() => { const c = document.getElementById('c-' + q.id); if (c) c.scrollIntoView({ block: 'start' }); }, 50);
  });
}
function renderOffenders(m){
  m.innerHTML = '<h1>Repeat Offenders</h1><p class="muted small">Every question you drop a mark on lands here. Retry it: full marks clears it. Aim to have this empty before the test.</p><div id="offl"></div>';
  offList($('#offl'));
}

// ---------------- PROGRESS
function bars(rows){ return '<div class="bars">' + rows.map(r => '<div class="b"><span class="lab">' + esc(r.lab) + '</span><span class="val">' + r.v + '</span><div class="track"><div class="fill" style="width:' + Math.max(0, Math.min(100, r.pct)) + '%"></div></div></div>').join('') + '</div>'; }
function renderProgress(m){
  const done = SESSIONS.filter(X => S.done[X.id]).length, ts = topicStats(), tsc = score(TEST);
  let h = '<h1>Progress</h1><div class="stat"><div class="card"><div class="v">' + done + '<span class="small muted">/' + SESSIONS.length + '</span></div><div class="l">sessions done</div></div><div class="card"><div class="v">' + (S.done.test ? Math.round(100 * tsc.got / TEST.total) + '%' : '–') + '</div><div class="l">practice test</div></div><div class="card"><div class="v">' + offenders().length + '</div><div class="l">offenders</div></div></div>';
  h += '<h2>Topics</h2><div class="card">' + bars(ts.map(t => ({ lab: t.title, v: t.pct === null ? '–' : t.pct + '%', pct: t.pct || 0 }))) + '<p class="small muted" style="margin-top:8px">Includes practice-test marks for each topic. Aim for 70%+ in every topic.</p></div>';
  if (S.done.test) h += '<h2>Practice test</h2><div class="card"><p><b>' + tsc.got + '/' + TEST.total + '</b> · grade ' + grade(Math.round(100 * tsc.got / TEST.total)) + '</p></div>';
  h += '<h2>Ten rules</h2><div class="card">' + rulesTable() + '</div>';
  m.innerHTML = h;
}

// ---------------- SETTINGS
$('#setBtn').onclick = () => {
  const d = $('#settings');
  d.innerHTML = '<h3>Settings</h3><label class="f" for="td">Test date</label><input type="date" id="td" value="' + S.testDate + '"><label class="f" for="th">Theme</label><select id="th"><option value="auto">Follow device</option><option value="light">Light</option><option value="dark">Dark</option></select><p class="small muted" style="margin-top:14px">Progress is saved in this browser on this device only.</p><div class="row" style="margin-top:14px"><button class="btn" id="rst">Reset progress</button><button class="btn primary" id="cls">Done</button></div>';
  $('#th').value = S.theme;
  $('#td').onchange = e => { S.testDate = e.target.value; save(); render(); };
  $('#th').onchange = e => { S.theme = e.target.value; applyTheme(); save(); };
  $('#rst').onclick = () => { if (confirm('Delete all progress and answers on this device?')) { const t = S.testDate, th = S.theme; S = blank(); S.testDate = t; S.theme = th; save(); d.close(); render(); toast('Progress reset'); } };
  $('#cls').onclick = () => d.close();
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
};

render();
})();
</script>
</body>
</html>
